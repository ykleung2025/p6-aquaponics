<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>魚菜共生・拼循環圖</title>
<style>
  :root{
    --blue:#4a9de0;
    --deep:#2c5b86;
    --ink:#20364a;
    --line:#a9c7e8;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
    background:linear-gradient(165deg,#e9f5ff 0%,#f1fbf4 55%,#eef9ff 100%);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    min-height:100%;
    overflow-x:hidden;
  }
  .page{
    max-width:640px;
    margin:0 auto;
    padding:18px 16px 40px;
  }
  .hd h1{
    font-size:clamp(19px,5vw,25px);
    margin:0 0 8px;
    text-align:center;
    color:var(--deep);
    letter-spacing:.5px;
  }
  .hd p{
    margin:0;
    text-align:center;
    font-size:clamp(12px,3.2vw,14px);
    color:#5b7d99;
    line-height:1.65;
  }

  /* ---------- 循環圖 ---------- */
  .circle-wrap{
    position:relative;
    width:min(90vw,420px);
    height:min(90vw,420px);
    margin:16px auto 6px;
  }
  .arrows{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  .slot{
    position:absolute;
    width:26%;
    height:26%;
    transform:translate(-50%,-50%);
    border-radius:22px;
    background:rgba(255,255,255,.84);
    border:2.5px dashed var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    padding:5px;
    text-align:center;
    font-size:clamp(10px,2.6vw,13px);
    line-height:1.3;
    color:#6d8ba6;
    font-weight:600;
    box-shadow:0 2px 6px rgba(70,120,170,.08);
    transition:background .18s,border-color .18s,box-shadow .18s;
  }
  .slot.hover{
    border-style:solid;
    border-color:var(--blue);
    background:#e8f4ff;
    box-shadow:0 0 0 5px rgba(74,157,224,.16);
  }
  .slot.filled{
    border-style:solid;
    border-color:#7fd1a4;
    background:linear-gradient(160deg,#f2fff7,#e0f7ea);
    color:#24704a;
    animation:pop .3s ease;
  }
  .slot.shake{ animation:shake .42s ease; }

  .slot-icon{ font-size:1.9em; line-height:1; }
  .slot-label{ font-size:.95em; font-weight:700; letter-spacing:.5px; }
  .slot-hint{ font-size:1em; }

  @keyframes pop{
    0%{ transform:translate(-50%,-50%) scale(.85); }
    60%{ transform:translate(-50%,-50%) scale(1.06); }
    100%{ transform:translate(-50%,-50%) scale(1); }
  }
  @keyframes shake{
    0%,100%{ transform:translate(-50%,-50%); }
    20%{ transform:translate(calc(-50% - 7px),-50%); }
    50%{ transform:translate(calc(-50% + 7px),-50%); }
    80%{ transform:translate(calc(-50% - 4px),-50%); }
  }

  /* ---------- 提示訊息 ---------- */
  .feedback{
    min-height:28px;
    text-align:center;
    font-size:clamp(12px,3.2vw,14px);
    font-weight:700;
    color:var(--blue);
    line-height:1.5;
    padding:2px 10px 0;
    transition:color .2s;
  }
  .feedback.ok{ color:#2f9e63; }
  .feedback.warn{ color:#e0834a; }

  /* ---------- 卡片區 ---------- */
  .tray{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:12px;
    padding:16px 12px;
    background:rgba(255,255,255,.7);
    border:2px dashed #cfe2f3;
    border-radius:20px;
    min-height:104px;
  }
  .card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    width:clamp(64px,19vw,84px);
    height:clamp(64px,19vw,84px);
    border-radius:18px;
    background:#fff;
    border:2px solid #dbe9f7;
    box-shadow:0 4px 10px rgba(60,110,170,.14);
    cursor:grab;
    touch-action:none;
    transition:transform .12s,box-shadow .12s,opacity .15s;
    color:var(--deep);
    font-weight:700;
    font-size:clamp(11px,3vw,13px);
  }
  .card .icon{ font-size:clamp(22px,6.5vw,30px); line-height:1; }
  .card:active{ transform:scale(.96); }
  .card.dragging{ opacity:.28; }

  .drag-ghost{
    position:fixed;
    z-index:9999;
    margin:0;
    pointer-events:none;
    opacity:.96;
    transform:scale(1.07);
    border-color:var(--blue);
    box-shadow:0 14px 30px rgba(40,90,150,.32);
  }

  /* ---------- 過關畫面 ---------- */
  .overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(226,242,255,.88);
    -webkit-backdrop-filter:blur(5px);
    backdrop-filter:blur(5px);
    opacity:0;
    pointer-events:none;
    transition:opacity .28s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .win-card{
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:26px;
    padding:28px 22px 24px;
    text-align:center;
    box-shadow:0 24px 60px rgba(50,110,170,.22);
    transform:scale(.88);
    transition:transform .32s cubic-bezier(.34,1.56,.64,1);
  }
  .overlay.show .win-card{ transform:scale(1); }
  .win-emoji{ font-size:52px; line-height:1; margin-bottom:10px; }
  .win-card h2{
    margin:0 0 14px;
    color:var(--deep);
    font-size:clamp(18px,4.6vw,22px);
  }
  .chain{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:6px;
    margin-bottom:14px;
    font-size:clamp(11px,3vw,13px);
    font-weight:700;
    color:#2f6b4f;
  }
  .chain .arw{ color:#9fbcd4; font-weight:400; }
  .win-note{
    margin:0 0 20px;
    font-size:clamp(11.5px,3.1vw,13px);
    line-height:1.75;
    color:#5b7d99;
  }
  .btn{
    border:none;
    border-radius:999px;
    padding:12px 32px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,#5cb3f0,#4a9de0);
    box-shadow:0 8px 20px rgba(74,157,224,.35);
    cursor:pointer;
    transition:transform .12s,box-shadow .12s;
  }
  .btn:active{
    transform:scale(.96);
    box-shadow:0 4px 12px rgba(74,157,224,.3);
  }
</style>
</head>
<body>

<div class="page">
  <header class="hd">
    <h1>魚菜共生・拼循環圖</h1>
    <p>把下面的卡片拖到循環圖中正確的位置，看看魚、細菌、植物和水怎樣互相幫助。</p>
  </header>

  <main>
    <div class="circle-wrap" id="circleWrap">
      <svg class="arrows" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="4.5" markerHeight="4.5"
                  markerUnits="userSpaceOnUse" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#7aa8dd"></path>
          </marker>
        </defs>
        <g fill="none" stroke="#7aa8dd" stroke-width="0.9" stroke-linecap="round">
          <path d="M 64.03 21.24 A 32 32 0 0 1 77.71 34.00" marker-end="url(#ah)"></path>
          <path d="M 77.71 66.00 A 32 32 0 0 1 64.03 78.76" marker-end="url(#ah)"></path>
          <path d="M 34.00 77.71 A 32 32 0 0 1 22.29 66.00" marker-end="url(#ah)"></path>
          <path d="M 22.29 34.00 A 32 32 0 0 1 35.97 21.24" marker-end="url(#ah)"></path>
        </g>
      </svg>
    </div>

    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="tray" id="tray"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <h2>恭喜！循環圖完成！</h2>
    <div class="chain">
      <span>🐟 魚排出廢物</span>
      <span class="arw">➜</span>
      <span>🦠 細菌轉化</span>
      <span class="arw">➜</span>
      <span>🌿 植物吸收</span>
      <span class="arw">➜</span>
      <span>💧 清水回流</span>
    </div>
    <p class="win-note">魚排出的廢物在水中變成氨，有益細菌把氨轉化成植物可用的養分；植物吸收養分後生長，同時令水質變清，清潔的水再流回魚池，循環不息。</p>
    <button class="btn" id="resetBtn" type="button">再玩一次</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* 循環元件 */
  var PIECES = [
    { id: 'fish',     icon: '🐟', label: '魚' },
    { id: 'bacteria', icon: '🦠', label: '有益細菌' },
    { id: 'plant',    icon: '🌿', label: '植物' },
    { id: 'water',    icon: '💧', label: '清水' }
  ];

  /* 四個位置（順時針：上 → 右 → 下 → 左） */
  var SLOTS = [
    { id: 's1', x: 50, y: 16, hint: '排出廢物，產生氨',     correct: 'fish' },
    { id: 's2', x: 84, y: 50, hint: '把氨轉化成養分',       correct: 'bacteria' },
    { id: 's3', x: 50, y: 84, hint: '吸收養分，令水質變清', correct: 'plant' },
    { id: 's4', x: 16, y: 50, hint: '清潔的水流回魚池',     correct: 'water' }
  ];

  var wrap     = document.getElementById('circleWrap');
  var tray     = document.getElementById('tray');
  var feedback = document.getElementById('feedback');
  var overlay  = document.getElementById('overlay');
  var fbTimer  = null;

  function labelOf(id) {
    for (var i = 0; i < PIECES.length; i++) {
      if (PIECES[i].id === id) return PIECES[i].label;
    }
    return '';
  }

  function pieceOf(id) {
    for (var i = 0; i < PIECES.length; i++) {
      if (PIECES[i].id === id) return PIECES[i];
    }
    return null;
  }

  function showFeedback(text, type) {
    feedback.textContent = text;
    feedback.className = 'feedback' + (type ? ' ' + type : '');
    clearTimeout(fbTimer);
    fbTimer = setTimeout(function () {
      feedback.textContent = '';
      feedback.className = 'feedback';
    }, 2800);
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildSlots() {
    var old = wrap.querySelectorAll('.slot');
    for (var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);

    SLOTS.forEach(function (s) {
      var el = document.createElement('div');
      el.className = 'slot';
      el.dataset.slot = s.id;
      el.dataset.correct = s.correct;
      el.style.left = s.x + '%';
      el.style.top  = s.y + '%';
      el.innerHTML = '<span class="slot-hint">' + s.hint + '</span>';
      wrap.appendChild(el);
    });
  }

  function buildTray() {
    tray.innerHTML = '';
    shuffle(PIECES).forEach(function (p) {
      var c = document.createElement('div');
      c.className = 'card';
      c.dataset.piece = p.id;
      c.innerHTML = '<span class="icon">' + p.icon + '</span>' +
                    '<span class="label">' + p.label + '</span>';
      c.addEventListener('pointerdown', onPointerDown);
      tray.appendChild(c);
    });
  }

  function placeCorrect(slot, card) {
    var p = pieceOf(card.dataset.piece);
    slot.classList.add('filled');
    slot.innerHTML = '<span class="slot-icon">' + p.icon + '</span>' +
                     '<span class="slot-label">' + p.label + '</span>';
    if (card.parentNode) card.parentNode.removeChild(card);

    showFeedback('答對了！繼續完成整個循環吧 👍', 'ok');

    if (wrap.querySelectorAll('.slot.filled').length === SLOTS.length) {
      setTimeout(function () {
        overlay.classList.add('show');
      }, 620);
    }
  }

  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    var card = e.currentTarget;
    if (card.classList.contains('dragging')) return;

    e.preventDefault();

    var rect   = card.getBoundingClientRect();
    var startX = e.clientX;
    var startY = e.clientY;
    var activeSlot = null;

    var ghost = card.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width  = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.left   = rect.left + 'px';
    ghost.style.top    = rect.top + 'px';
    document.body.appendChild(ghost);

    card.classList.add('dragging');

    function onMove(ev) {
      ghost.style.left = (rect.left + ev.clientX - startX) + 'px';
      ghost.style.top  = (rect.top  + ev.clientY - startY) + 'px';

      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var slot = el ? el.closest('.slot') : null;
      if (slot && slot.classList.contains('filled')) slot = null;

      if (slot !== activeSlot) {
        if (activeSlot) activeSlot.classList.remove('hover');
        activeSlot = slot;
        if (activeSlot) activeSlot.classList.add('hover');
      }
    }

    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);

      if (activeSlot) activeSlot.classList.remove('hover');
      if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
      card.classList.remove('dragging');

      if (ev.clientX == null || ev.clientY == null) return;

      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var slot = el ? el.closest('.slot') : null;
      if (!slot) return;

      if (slot.classList.contains('filled')) {
        showFeedback('這個位置已經放好了，試試其他位置吧。', 'warn');
        return;
      }

      if (slot.dataset.correct === card.dataset.piece) {
        placeCorrect(slot, card);
      } else {
        slot.classList.add('shake');
        setTimeout(function () { slot.classList.remove('shake'); }, 440);
        showFeedback('不對啊～這個位置不是放「' + labelOf(card.dataset.piece) + '」的，再想想！', 'warn');
      }
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  function init() {
    buildSlots();
    buildTray();
    overlay.classList.remove('show');
    clearTimeout(fbTimer);
    feedback.textContent = '';
    feedback.className = 'feedback';
  }

  document.getElementById('resetBtn').addEventListener('click', init);
  init();
})();
</script>
</body>
</html>
